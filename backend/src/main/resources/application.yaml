spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://db:5432/orbittrack
    username: ${DB_USERNAME:orbittrack}
    password: ${DB_PASSWORD:orbittrack_dev}

  flyway:
    # Chaque membre a sa plage de numéros de migration (Selma V10-V19, Ritej V20-V29, Celia V30-V39).
    # Comme on travaille en parallèle, un V10 peut arriver après un V20 déjà appliqué sur une base locale :
    # out-of-order l'accepte au lieu de bloquer le démarrage.
    out-of-order: true

  jpa:
    open-in-view: false
    hibernate:
      # Les tables sont créées par les migrations Flyway (src/main/resources/db/migration).
      # Hibernate vérifie seulement que les entités correspondent aux tables.
      ddl-auto: validate

  data:
    redis:
      host: redis
      port: 6379

server:
  port: 8080

orbittrack:
  security:
    jwt:
      # Obligatoire : au moins 32 caractères. À définir dans le fichier .env (voir .env.example).
      secret: ${JWT_SECRET:}
      # Durée de validité d'un jeton de connexion (format ISO-8601 : PT2H = 2 heures).
      expiration: ${JWT_EXPIRATION:PT2H}
    admin:
      # Premier administrateur créé au démarrage s'il n'en existe aucun. Laisser vide pour ne rien créer.
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
  forum:
    # Anti-spam du forum (feature 9).
    max-messages-per-minute: 5
    duplicate-window: PT10M
