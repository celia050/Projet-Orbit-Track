# Intégration continue d'Orbit Track
# À chaque push et à chaque Pull Request sur main ou develop :
#  - backend : compilation + tests (dont tests d'intégration PostgreSQL via Testcontainers)
#  - frontend : lint + tests Vitest + compilation
#  - docker : construction des images
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build et tests
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Publication du rapport JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: couverture-backend
          path: backend/target/site/jacoco/

      - name: Publication des classes Java
        uses: actions/upload-artifact@v4
        with:
          name: classes-backend
          path: backend/target/classes/

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

      - name: Publication du rapport Vitest
        uses: actions/upload-artifact@v4
        with:
          name: couverture-frontend
          path: frontend/coverage/

  docker:
    name: Docker (construction des images)
    runs-on: ubuntu-latest
    env:
      # Valeur factice : uniquement pour que docker compose accepte le fichier
      JWT_SECRET: valeur-factice-pour-la-ci-uniquement-0123456789
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build


  sonarqube:
    name: SonarCloud (qualite et securite)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: couverture-backend
          path: backend/target/site/jacoco/

      - uses: actions/download-artifact@v4
        with:
          name: classes-backend
          path: backend/target/classes/

      - uses: actions/download-artifact@v4
        with:
          name: couverture-frontend
          path: frontend/coverage/

      - uses: SonarSource/sonarqube-auth-action@v1.2
        id: auth

      - name: Analyse SonarCloud
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16
        with:
          args: >
            -Dsonar.organization=${{ steps.auth.outputs.organization }}
            -Dsonar.projectKey=${{ steps.auth.outputs.project-key }}
